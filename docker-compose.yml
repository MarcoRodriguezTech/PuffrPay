services:
  postgres:
    image: postgres:16-alpine
    container_name: puffrpay-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: puffrpay
    ports:
      - "5433:5432"
    volumes:
      - puffrpay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d puffrpay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  puffrpay-pgdata:
