<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Puffr, the pufferfish mascot">
  <defs>
    <radialGradient id="puffrBody" cx="42%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#f9dd75"/>
      <stop offset="58%" stop-color="#eec055"/>
      <stop offset="100%" stop-color="#d9973a"/>
    </radialGradient>
    <radialGradient id="puffrFin" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#e9bc55"/>
      <stop offset="100%" stop-color="#c98430"/>
    </radialGradient>
  </defs>

  <!-- side fins behind the body -->
  <path d="M 34 118 Q 8 112 6 90 Q 24 88 38 104 Q 42 112 34 118 Z" fill="url(#puffrFin)" stroke="#3b2a14" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 166 118 Q 192 112 194 90 Q 176 88 162 104 Q 158 112 166 118 Z" fill="url(#puffrFin)" stroke="#3b2a14" stroke-width="4" stroke-linejoin="round"/>

  <!-- spiky silhouette -->
  <path d="M 100.0 7.0 L 116.5 29.9 L 141.2 16.4 L 146.1 44.1 L 174.3 42.8 L 166.7 69.9 L 192.6 80.9 L 174.0 102.0 L 192.6 123.1 L 166.7 134.1 L 174.3 161.2 L 146.1 159.9 L 141.2 187.6 L 116.5 174.1 L 100.0 197.0 L 83.5 174.1 L 58.8 187.6 L 53.9 159.9 L 25.7 161.2 L 33.3 134.1 L 7.4 123.1 L 26.0 102.0 L 7.4 80.9 L 33.3 69.9 L 25.7 42.8 L 53.9 44.1 L 58.8 16.4 L 83.5 29.9 Z"
        fill="url(#puffrBody)" stroke="#3b2a14" stroke-width="4" stroke-linejoin="round"/>

  <!-- belly + sheen -->
  <ellipse cx="100" cy="140" rx="46" ry="30" fill="#f6df9a" opacity="0.55"/>
  <ellipse cx="76" cy="58" rx="30" ry="16" fill="#ffffff" opacity="0.35" transform="rotate(-18 76 58)"/>

  <!-- eyes -->
  <circle cx="74" cy="88" r="11" fill="#241a0e"/>
  <circle cx="126" cy="88" r="11" fill="#241a0e"/>
  <circle cx="77.5" cy="84.5" r="3.6" fill="#ffffff"/>
  <circle cx="129.5" cy="84.5" r="3.6" fill="#ffffff"/>
  <circle cx="70.5" cy="91.5" r="1.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="122.5" cy="91.5" r="1.8" fill="#ffffff" opacity="0.7"/>

  <!-- blush -->
  <circle cx="60" cy="108" r="6.5" fill="#e58e6e" opacity="0.5"/>
  <circle cx="140" cy="108" r="6.5" fill="#e58e6e" opacity="0.5"/>

  <!-- smile -->
  <path d="M 86 120 Q 100 130 114 120" fill="none" stroke="#241a0e" stroke-width="4.5" stroke-linecap="round"/>

  <!-- freckle spots -->
  <circle cx="88" cy="146" r="3" fill="#b87f2a" opacity="0.6"/>
  <circle cx="112" cy="150" r="2.4" fill="#b87f2a" opacity="0.6"/>
  <circle cx="100" cy="160" r="2" fill="#b87f2a" opacity="0.45"/>
</svg>
