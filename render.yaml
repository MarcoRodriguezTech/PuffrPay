# Render blueprint: Next.js web service + managed Postgres.
# After `render.yaml` deploys, run migrations/seed once from the Render shell
# (see README "Deploy on Render").
services:
  - type: web
    name: puffrpay
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: puffrpay-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: CHANNEL3_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

databases:
  - name: puffrpay-db
    plan: free
    databaseName: puffrpay
    user: puffrpay
